    var getOption = function (key) {
        if (window.location) {
            var search = location.search;
            if (search == "") {
                return "";
            }
            search = search.slice(1);
            var searchArr = search.split("&");
            var length_1 = searchArr.length;
            for (var i = 0; i < length_1; i++) {
                var str = searchArr[i];
                var arr = str.split("=");
                if (arr[0] == key) {
                    return arr[1];
                }
            }
        }
        return "";
    }

    var loadScript = function (cdn_path, list, callback) {
        var loaded = 0;
        var loadNext = function () {
            loadSingleScript(cdn_path, list[loaded], function () {
                loaded++;
                if (loaded >= list.length) {
                    callback();
                }
                else {
                    loadNext();
                }
            })
        };
        loadNext();
    };

    var loadSingleScript = function (cdn_path, src, callback) {
        var s = document.createElement('script');
        s.async = false;
        s.src = cdn_path + src;
        if (src.indexOf("main.js") != -1 || src.indexOf("pro-library.js") != -1) s.src = s.src + "?v="+Math.random();
        console.log("cdn_path + src = ", cdn_path + src);
        s.addEventListener('load', function f() {
            s.parentNode.removeChild(s);
            s.removeEventListener('load', f, false);
            callback();
        }, false);
        document.body.appendChild(s);
    };

    var update_div = function (x_off) {
        if (div) {
            // console.log(document.body)
            // console.log(div.getBoundingClientRect())
            //跟unity canvas的extemd适配模式一样 取改变最大的一方作为缩放因子
            var clientWidth = document.body.clientWidth//window.screen.width
            var clientHeight = document.body.clientHeight//window.screen.height
            if (!is_mobile) {
                var full_screen_bg = document.getElementById("full_screen_bg");
                if (full_screen_bg) {
                    full_screen_bg.src = "resource/game/login/other/full_screen_bg1.jpg?v=3"
                    var onScreenresize = function () {
                        clientWidth = document.body.clientWidth
                        clientHeight = document.body.clientHeight
                        var bg_scaleX = 1280 / clientWidth;
                        var bg_scaleY = 720 / clientHeight;
                        var bg_max_scale = Math.min(bg_scaleX, bg_scaleY)
                        var bg_width = 1280 / bg_max_scale
                        var bg_height = 720 / bg_max_scale
                        full_screen_bg.style.width = bg_width + 'px';
                        full_screen_bg.style.height = bg_height + 'px';
                        if (bg_max_scale == bg_scaleX) {
                            var bg_h_scale = bg_height / clientHeight
                            full_screen_bg.style.top = (1 - bg_h_scale) * 0.5 * 100 + "%"
                        } else {
                            var bg_w_scale = bg_width / clientWidth
                            full_screen_bg.style.left = (1 - bg_w_scale) * 0.5 * 100 + "%"
                        }
                    }
                    // console.log("full_screen_bg.style.top",full_screen_bg.style.top, full_screen_bg.style.left);
                    window.onresize = function () {
                        console.log("onresize")
                        onScreenresize();
                    }
                    onScreenresize();
                }
            } else {
                document.body.style.backgroundColor = "#000000";
            }
            // _last_client_width = clientWidth
            // _last_client_height = clientHeight
            console.log(clientWidth, clientHeight, document.body.style.backgroundColor)
            var realy_width = 720
            var realy_height = 1280
            var bg = document.getElementById("bg");
                       let func = Math.min
            // if (true) {
                realy_width = 870
                realy_height = 1560
                // scaleX =  realy_width / clientWidth;
                if (!bg.src) {
                    if(login_bg)
                    {
                        bg.src = "platform/res/login/"+ login_bg+".jpg"
                    }else
                    {
                        bg.src = "resource/game/scene/dragonBones/denglu/denglu_bg.jpg?v=7"
                    }
                }
            var scaleX = realy_width / clientWidth;
            var scaleY = realy_height / clientHeight;
            var max_scale = scaleY;//func(scaleX, scaleY)
            if(is_mobile)
            {
                max_scale = func(scaleX, scaleY)
            }
            var width = realy_width / max_scale * 1.218
            var height = realy_height / max_scale * 1.218
            div.style.width = width + 'px';
            div.style.height = height + 'px';
            bg.style.height = height + 'px';
            if (max_scale == scaleX) {
                var h_scale = height / clientHeight
                div.style.top = (1 - h_scale) * 0.5 * 100 + "%"
                if (realy_width == 870) {
                    var w_scale = width / clientWidth
                    w_scale = (1 - w_scale) * 0.5 * 100
                    div.style.left = w_scale + "%"
                }
            } else {
                var w_scale = width / clientWidth
                w_scale = (1 - w_scale) * 0.5 * 100
                div.style.left = w_scale + "%"
                if (realy_height == 1560) {
                    var h_scale = height / clientHeight
                    div.style.top = (1 - h_scale) * 0.5 * 100 + "%"
                }
            }
            text_obj.style.fontSize = (20 / max_scale) + "px"
            text_obj2.style.fontSize = (20 / max_scale) + "px"
        }
    }

    var text_list = ["首次加载时间较长，不如先想想帅气的名字吧~", "神奈之里正在迅速构建，请耐心等候哦~", "你是不是有些迫不及待了呀？我在更努力的加载了~", "嗖嗖嗖——我看到神奈之里的大门了，哇~"];

    text_obj2.textContent = text_list2[text_len2];
    var update_div_time = next_time + 100; //延迟100毫秒刷新 防止wing上初始布局有问题
    var next_time = new Date().getTime();
    var next_time2 = next_time;
    next_time += 1000;
    next_time2 += 4000;
    window["timeSi"] = setInterval("update();", 30);
    var step = 1;
    var step2 = 1;
    var curr_time = null;
    var speed = 0.15
    var speed2 = speed * text_list2.length
    var bar = document.getElementById("progImg");
    var bar2 = document.getElementById("progImg2");
    function update() {
        step += speed;
        step2 += speed2;
        setBarWidth(step);
        setBarWidth2(step2);
        curr_time = new Date().getTime();
        if (update_div_time && curr_time >= update_div_time) {
            update_div_time = null
            update_div(0)
        }

        if (curr_time >= next_time) {
            ++text_len;
            if (text_len >= text_list.length) {
                text_len = 0;
            }
            next_time = next_time + 4000;
            text_obj.textContent = text_list[text_len];
        }

    }

    let removeLoadPage = function() {
        var d = document.getElementById("loadingDiv");
        if (d) {
            document.body.removeChild(d);
        }
        if (window["timeSi"] > 0) {
            clearInterval(window["timeSi"]);
        }
    }



    let setBarWidth = function(p) {
        if (bar) {
            if (p > 79) {
                p = 79;
                // removeLoadPage()
                // window.location.reload()
            }
            var w = p;
            // console.log(document.body.clientWidth, document.body.clientHeight)
            bar.style.width = w + '%';

    let setBarWidth2 = function(p) {
        if (bar2) {
            if (p > 80) {

            }
            var w = p;
            // console.log(window.screen.height, window.screen.width)
            // console.log(document.body.clientWidth, document.body.clientHeight)
            bar2.style.width = w + '%';

            if (p >= 79) {
                ++text_len2;
                if (text_len2 < text_list2.length) {
                    step2 = 0;
                } else {
                    text_len2 = text_list2.length - 1
                }
            }
            text_obj2.textContent = text_list2[text_len2] + '[' + Math.floor(p / 80 * 100) + '%]';
            // bar2.style.height = '15px';
        }
    }

    // //http请求加载json
    let HttpRequest = function(url, call_func, need_json_format, type) {
        var v_xhr = new XMLHttpRequest();
        v_xhr.open('GET', url, true);
        v_xhr.responseType = type
        v_xhr.addEventListener("load", function () {
            var json_obj = v_xhr.response;
            if (need_json_format) {
                json_obj = JSON.parse(json_obj);
            }
            if (call_func) {
                call_func(json_obj)
            }
            // console.log("json_obj =", json_obj)
        });
        v_xhr.send(null);
    }

    function loadLib(url) {
        var script = document.createElement("script");
        script.async = false;
        script.src = url;
        script.addEventListener('load', function () {
                        script.parentNode.removeChild(script);

    let loadConfigComplete = function(cfg_obj) {
        var cdn_res_path = ""
        if(cfg_obj)
        {
            cdn_res_path = cfg_obj.ResUrl || ""
        }
        HttpRequest(cdn_res_path + 'resource/game_manul_version.json?v=' + Math.random(), function (json_obj) {
            if (json_obj) {
                version_text.textContent = 'version:' + json_obj.main_version + '.' + json_obj.hot_update_version
                window["engine_version"] = json_obj.engine_version
                window["main_version"] = json_obj.main_version
                window["hot_update_version"] = json_obj.hot_update_version

                window["resource_version"] = json_obj.resource_version
                window["js_version"] = json_obj.js_version
                window["uiconfig_version"] = json_obj.uiconfig_version

                var engine_ver = window["engine_version"] || 1
                var is_debug = false
                var curr_url = window.location.href.toString();
                if (curr_url) {
                    var param_list = curr_url.split(":");
                    if (param_list && param_list[0]) {
                        if(param_list[0] == "file" || curr_url.indexOf("localhost") >= 0)
                        {

                        }
                    }
                }
                window["run_in_es5"] = false
                try {
                    eval('function foo(bar, ...rest) { return 1; };');
                    console.log("-----------------run in es6------------------")
                } catch (error) {
                    console.log("-----------------run in es5------------------")
                    window["run_in_es5"] = true
                }
        
           
                window["subPackage_loaded"] = false
                if(is_debug)
                {
                    window["subPackage_loaded"] = true
                    loadLib("index.js?v="+Math.random()); //调试版leb必须调用index.js才生效
                }else
                {
                    var loadReleaseLib = function(url, callback) {
                        var script = document.createElement("script");
                        script.async = false;
                        script.src = url;
                        script.addEventListener('load', function () {
                            script.parentNode.removeChild(script);
                            // if(!window["run_in_es5"])
                            //     script.removeEventListener('load', arguments.caller, false);
                            if(callback)
                            {
                                callback();
                            }
                        }, false);
                        document.body.appendChild(script);
                    }
                    var loadBundleCallback = function()
                    {
                        // if(plat_name)//外服才需要接入ta数数
                        if(1)
                        {
                            loadReleaseLib("libs/min/thinkingdata.umd.min.js?v=" + engine_ver, function ()
                            {
                                LoadthinkingdataCallback()
                            });
                        }
                    }
                    var main_ver = window["js_version"] || 1
                    if(window["run_in_es5"])
                    {
                        loadReleaseLib("libs/laya.core.js?v="+engine_ver+1, null);
                        loadReleaseLib("libs/laya.ui.js?v="+engine_ver+1, null);
                        loadReleaseLib("libs/laya.d3.js?v="+engine_ver+1, null);
                        loadReleaseLib("libs/laya.html.js?v="+engine_ver+1, null);
                        loadReleaseLib("libs/laya.device.js?v="+engine_ver+1, null);
                        loadReleaseLib("libs/jszip.js?v=1"+1, null);
                        loadReleaseLib("libs/polyfill.js?v=1", null);
                        loadReleaseLib("js/bundle_es5.js?v=" + main_ver, function ()
                        {
                            loadBundleCallback();
                            setTimeout(() => {
                                loadReleaseLib("js/subPackage_es5.js?v=" + main_ver, function ()
                                {
                                    window["subPackage_loaded"] = true
                                });
                            }, 1000); 
                        }); 
                    }else
                    {
                        loadReleaseLib("libs/min/laya.core.min.js?v="+engine_ver, null);
                        loadReleaseLib("libs/min/laya.ui.min.js?v="+engine_ver, null);
                        loadReleaseLib("libs/min/laya.d3.min.js?v="+engine_ver, null);
                        loadReleaseLib("libs/min/laya.html.min.js?v="+engine_ver, null);
                        loadReleaseLib("libs/min/laya.device.min.js?v="+engine_ver, null);
                        loadReleaseLib("libs/min/jszip.min.js?v=1", null);
                        loadReleaseLib("js/bundle.js?v=" + main_ver, function ()

    let load_default_config = function() {

        var url = 'platform/config_' + plat_name + '.cfg?v='

        load_default_config()
    }
